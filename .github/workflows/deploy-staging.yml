# Staging-only deploy workflow.
# Production deploys are handled by deploy-production.yml (push to main,
# test-gated; manual dispatch also available — always test-gated after the
# SEC-09 fix). See docs/DEPLOY_SECURITY.md for the full deploy policy.

name: Deploy Staging

on:
  push:
    branches: main
    paths-ignore:
      - "*.md"
      - "docs/**"
      - ".gitignore"

# SEC-09 FIX (Phase 20): least-privilege GITHUB_TOKEN — this workflow only
# checks out the repo; the deploy authenticates with CLOUDFLARE_* secrets,
# not GITHUB_TOKEN. Previously no permissions block existed, so the token
# inherited the repo/org default (potentially read/write).
permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  test:
    name: Run Worker Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Run worker tests
        run: npm test

  deploy-staging:
    name: Deploy Worker (Staging Only)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Deploy Worker (Staging)
        run: npx wrangler deploy --env staging
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}