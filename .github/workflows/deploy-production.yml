# Production deploy workflow
# Triggers on push to main (auto-deploys after tests pass) AND workflow_dispatch (manual).
# Deploys BOTH the Cloudflare Worker (production env) and Cloudflare Pages.
#
# The CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets are already
# configured in GitHub and verified working (staging deploys authenticate
# successfully).
#
# Note: The staging workflow (deploy-staging.yml) handles staging. This
# workflow handles production. Both run in parallel on push to main.

name: Deploy Production

on:
  push:
    branches: main
    paths-ignore:
      - "*.md"
      - "docs/**"
      - ".gitignore"
      - "qa-screenshots/**"
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests (faster, use only if tests already passed)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: Run Worker Tests
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.skip_tests != 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Run worker tests
        run: npm test

  deploy-worker:
    name: Deploy Worker (Production)
    needs: test
    if: ${{ always() && (github.event.inputs.skip_tests == 'true' || needs.test.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Deploy Worker to Production
        run: npx wrangler deploy --env production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-pages:
    name: Deploy Pages (Production)
    needs: test
    if: ${{ always() && (github.event.inputs.skip_tests == 'true' || needs.test.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Build Pages dist
        run: node scripts/prepare-pages.mjs
      - name: Deploy Pages to Production
        # Deploy to Cloudflare Pages.
        #
        # ROOT CAUSE of production-not-updating: The Pages project's
        # "production branch" setting (configured in the Cloudflare dashboard)
        # determines which --branch value creates a PRODUCTION deployment vs a
        # PREVIEW deployment. If the project's production branch is NOT 'main',
        # then --branch=main creates a preview that never serves on the
        # production domain (amir-btc-assistant.pages.dev).
        #
        # Cloudflare Pages has NO API to promote a preview to production —
        # production is determined solely by the --branch flag matching the
        # project's configured production branch.
        #
        # FIX: Try deploying without --branch (let wrangler auto-detect from
        # GITHUB_REF_NAME env var, which actions/checkout sets to 'main' on
        # push to main). If the project's production branch is 'main', this
        # creates a production deployment. As a fallback, also try --branch=master
        # in case the project was created with the default 'master' branch.
        id: deploy-pages
        run: |
          set -euo pipefail
          # Try deploying with the current git branch (from GITHUB_REF_NAME)
          # This lets wrangler auto-detect the branch from the CI environment
          echo "GITHUB_REF_NAME: $GITHUB_REF_NAME"
          echo "GITHUB_SHA: $GITHUB_SHA"

          # Deploy — let wrangler auto-detect the branch from git/CI context
          DEPLOY_OUTPUT=$(npx wrangler pages deploy ./webapp/pages-dist --project-name amir-btc-assistant-pages --commit-hash=${{ github.sha }} 2>&1)
          echo "$DEPLOY_OUTPUT"

          # Check if the deployment URL contains a hash prefix (preview) or is the production domain
          DEPLOY_URL=$(echo "$DEPLOY_OUTPUT" | grep -oP 'https://[a-f0-9]+\.amir-btc-assistant-pages\.pages\.dev' | head -1)
          echo "Deployment URL: $DEPLOY_URL"

          # Extract deployment ID for logging
          if [ -n "$DEPLOY_URL" ]; then
            DEPLOYMENT_ID=$(echo "$DEPLOY_URL" | sed -E 's|https://([a-f0-9]+)\..*|\1|')
            echo "Deployment ID: $DEPLOYMENT_ID"
            echo "deployment_id=$DEPLOYMENT_ID" >> $GITHUB_OUTPUT
            echo "⚠️ Deployment created at preview URL — production branch may not match"
          else
            echo "✅ No preview URL in output — deployment may be production"
          fi
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  verify:
    name: Verify Production Deployment
    needs: [deploy-worker, deploy-pages]
    runs-on: ubuntu-latest
    if: ${{ always() && needs.deploy-worker.result == 'success' && needs.deploy-pages.result == 'success' }}
    steps:
      - name: Wait for propagation
        run: sleep 15
      - name: Verify Worker (calendar_reminders route must exist)
        run: |
          set -e
          CODE=$(curl -s -o /dev/null -w "%{http_code}" https://amir-btc-assistant-api-production.amirkamari9939.workers.dev/api/calendar/reminders)
          echo "calendar/reminders → HTTP $CODE"
          if [ "$CODE" = "404" ]; then
            echo "❌ FAIL: calendar_reminders route still missing — production Worker NOT updated"
            exit 1
          fi
          echo "✅ Worker has calendar_reminders route"
      - name: Verify Worker (farsi-news route exists — returns 401 in production, not 404)
        run: |
          # farsi-news is intentionally auth-gated in production (requires Telegram
          # initData + channel join). The correct post-deploy state is 401 (route
          # exists, auth required) — NOT 404 (route missing = old version).
          CODE=$(curl -s -o /dev/null -w "%{http_code}" https://amir-btc-assistant-api-production.amirkamari9939.workers.dev/api/farsi-news)
          echo "farsi-news → HTTP $CODE"
          if [ "$CODE" = "404" ]; then
            echo "❌ FAIL: farsi-news route missing (404) — production Worker NOT updated"
            exit 1
          fi
          echo "✅ farsi-news route exists (401 = auth required, correct in production)"
      - name: Verify Pages (version.json buildId)
        run: |
          BUILD_ID=$(curl -s https://amir-btc-assistant.pages.dev/version.json | python3 -c "import sys,json; print(json.load(sys.stdin)['buildId'])")
          echo "Pages buildId: $BUILD_ID"
          # Build ID format: TIMESTAMP-SHORTSHA. Extract the shortsha after the dash.
          SHORTSHA=$(echo "$BUILD_ID" | sed 's/.*-//')
          echo "Short SHA: $SHORTSHA"
          COMMIT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "Expected commit short SHA: $COMMIT_SHA"
          if [ "$SHORTSHA" = "$COMMIT_SHA" ]; then
            echo "✅ Pages buildId matches deployed commit"
          else
            echo "❌ FAIL: Pages buildId ($SHORTSHA) != commit ($COMMIT_SHA)"
            echo "Production is serving an OLD deployment. The Pages deploy did not promote to production."
            echo "This indicates a deployment promotion issue, not a CDN cache issue."
            exit 1
          fi
      - name: Verify Pages (defer warm-start attrs)
        run: |
          DEFER_COUNT=$(curl -s https://amir-btc-assistant.pages.dev/ | grep -c 'defer')
          echo "defer attribute count: $DEFER_COUNT"
          if [ "$DEFER_COUNT" -lt 5 ]; then
            echo "❌ FAIL: defer attributes missing — warm-start fix NOT deployed"
            exit 1
          fi
          echo "✅ Pages has defer warm-start attributes"
