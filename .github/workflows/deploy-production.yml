# Production deploy workflow (trigger after production_branch config update)
# Triggers on push to main (auto-deploys after tests pass) AND workflow_dispatch (manual).
# Deploys BOTH the Cloudflare Worker (production env) and Cloudflare Pages.
#
# The CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets are already
# configured in GitHub and verified working (staging deploys authenticate
# successfully).
#
# Note: The staging workflow (deploy-staging.yml) handles staging. This
# workflow handles production. Both run in parallel on push to main.

name: Deploy Production

on:
  push:
    branches: main
    paths-ignore:
      - "*.md"
      - "docs/**"
      - ".gitignore"
      - "qa-screenshots/**"
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests (faster, use only if tests already passed)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: Run Worker Tests
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.skip_tests != 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Run worker tests
        run: npm test

  deploy-worker:
    name: Deploy Worker (Production)
    needs: test
    if: ${{ always() && (github.event.inputs.skip_tests == 'true' || needs.test.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Deploy Worker to Production
        run: npx wrangler deploy --env production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-pages:
    name: Deploy Pages (Production)
    needs: test
    if: ${{ always() && (github.event.inputs.skip_tests == 'true' || needs.test.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Build Pages dist
        run: node scripts/prepare-pages.mjs
      - name: Deploy Pages to Production
        # ROOT CAUSE: The Cloudflare Pages project's "production branch" setting
        # (configured in the dashboard) is NOT 'main'. When wrangler deploys with
        # --branch=main (or auto-detects main from GITHUB_REF_NAME), it creates a
        # PREVIEW deployment because main != the configured production branch.
        # This is why production (amir-btc-assistant.pages.dev) has been stuck
        # serving commit 9439bac — all recent deploys went to preview URLs.
        #
        # Cloudflare Pages has NO API to promote a preview to production.
        # The ONLY way to fix this is to set the project's production_branch
        # to 'main' via the Cloudflare API, then deploy.
        #
        # FIX: Before deploying, use the Cloudflare API to PATCH the project's
        # deployment_configs.production_branch to 'main'. Then deploy with
        # --branch=main which will now create a PRODUCTION deployment.
        id: deploy-pages
        run: |
          set -euo pipefail

          # Step 1: Set the project's production branch to 'main' via Cloudflare API
          # The correct field is the top-level 'production_branch' (NOT
          # deployment_configs.production.deployment_branch which is a different setting).
          echo "Setting production_branch to 'main' via Cloudflare API..."
          PATCH_RESPONSE=$(curl -s -w "\n%{http_code}" -X PATCH \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/amir-btc-assistant" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"production_branch":"main"}')
          PATCH_HTTP_CODE=$(echo "$PATCH_RESPONSE" | tail -1)
          PATCH_BODY=$(echo "$PATCH_RESPONSE" | head -n -1)
          echo "Project PATCH HTTP Status: $PATCH_HTTP_CODE"
          echo "Project PATCH Response (first 500 chars): $(echo "$PATCH_BODY" | head -c 500)"

          if [ "$PATCH_HTTP_CODE" = "200" ]; then
            PATCH_SUCCESS=$(echo "$PATCH_BODY" | python3 -c "import sys,json; print(json.load(sys.stdin).get('success', False))" 2>/dev/null || echo "False")
            if [ "$PATCH_SUCCESS" = "True" ]; then
              echo "✅ production_branch set to 'main'"
            else
              echo "⚠️ Project PATCH returned success=false — continuing anyway"
            fi
          else
            echo "⚠️ Project PATCH failed with HTTP $PATCH_HTTP_CODE — continuing anyway"
          fi

          # DIAGNOSTIC: Query the project config to verify production_branch is actually set
          echo ""
          echo "=== DIAGNOSTIC: Verifying production_branch via GET /projects/{name} ==="
          GET_RESPONSE=$(curl -s -w "\n%{http_code}" \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/amir-btc-assistant" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}")
          GET_HTTP_CODE=$(echo "$GET_RESPONSE" | tail -1)
          GET_BODY=$(echo "$GET_RESPONSE" | head -n -1)
          echo "GET project HTTP Status: $GET_HTTP_CODE"
          echo "production_branch in response: $(echo "$GET_BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('result',{}).get('production_branch', 'NOT FOUND'))" 2>/dev/null || echo 'parse error')"
          echo "latest_deployment environment: $(echo "$GET_BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('result',{}).get('latest_deployment',{}).get('environment', 'NOT FOUND'))" 2>/dev/null || echo 'parse error')"
          echo "latest_deployment short_id: $(echo "$GET_BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('result',{}).get('latest_deployment',{}).get('short_id', 'NOT FOUND'))" 2>/dev/null || echo 'parse error')"

          # DIAGNOSTIC: List all deployments to see which are production vs preview
          echo ""
          echo "=== DIAGNOSTIC: Listing recent deployments ==="
          LIST_RESPONSE=$(curl -s -w "\n%{http_code}" \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/amir-btc-assistant/deployments?per_page=10&sort_by=created_on&sort_order=desc" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}")
          LIST_HTTP_CODE=$(echo "$LIST_RESPONSE" | tail -1)
          LIST_BODY=$(echo "$LIST_RESPONSE" | head -n -1)
          echo "List deployments HTTP Status: $LIST_HTTP_CODE"
          echo "$LIST_BODY" | python3 -c "import sys, json; d=json.load(sys.stdin); deps=d.get('result',[]); print(f'Total: {len(deps)}'); [print(f'  {dep.get(\"short_id\",\"?\")}  env={dep.get(\"environment\",\"?\")}  branch={dep.get(\"deployment_trigger\",{}).get(\"metadata\",{}).get(\"branch\",\"?\")}  skipped={dep.get(\"is_skipped\",False)}  created={dep.get(\"created_on\",\"?\")[:19]}') for dep in deps[:10]]" 2>/dev/null || echo "Failed to parse deployment list"

          # Step 2: Deploy with --branch=main (now matches the production branch)
          # Note: don't use set -e for the wrangler deploy — we need to capture
          # the output even if wrangler returns non-zero (it sometimes does on
          # warnings). We check the output for the deployment URL instead.
          # Explicitly export the token for wrangler (the env block sets it but
          # the subshell capture sometimes doesn't inherit it).
          # Also set CLOUDFLARE_PAGES_BRANCH=main to help wrangler identify the
          # branch correctly in CI environments.
          export CLOUDFLARE_API_TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}"
          export CLOUDFLARE_ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          export CLOUDFLARE_PAGES_BRANCH="main"
          echo ""
          echo "Deploying with --branch=main (CLOUDFLARE_PAGES_BRANCH=main)..."
          DEPLOY_OUTPUT=$(npx wrangler pages deploy ./webapp/pages-dist --project-name amir-btc-assistant --branch=main --commit-hash=${{ github.sha }} 2>&1) || true
          echo "$DEPLOY_OUTPUT"

          # Extract deployment URL for logging
          DEPLOY_URL=$(echo "$DEPLOY_OUTPUT" | grep -oP 'https://[a-f0-9]+\.amir-btc-assistant\.pages\.dev' | head -1)
          echo "Deployment URL: $DEPLOY_URL"
          if [ -z "$DEPLOY_URL" ]; then
            echo "❌ FAIL: Could not extract deployment URL from wrangler output"
            echo "Wrangler may have failed. Check the output above."
            exit 1
          fi
          DEPLOYMENT_ID=$(echo "$DEPLOY_URL" | sed -E 's|https://([a-f0-9]+)\..*|\1|')
          echo "Deployment ID: $DEPLOYMENT_ID"
          echo "deployment_id=$DEPLOYMENT_ID" >> $GITHUB_OUTPUT

      - name: Promote deployment to production via Cloudflare API
        # ROOT CAUSE: wrangler creates deployments marked as environment=production
        # by the API, but the production hostname doesn't serve them (x-robots-tag:
        # noindex = preview). The Cloudflare API has a rollout endpoint that
        # promotes a deployment to the production alias.
        #
        # Official endpoint: POST /accounts/{id}/pages/projects/{name}/deployments/{id}/rollout
        # Per Cloudflare API v4 docs: https://developers.cloudflare.com/api/operations/pages-deployment-rollout
        #
        # Previous attempts used the short_id (e.g. "9a32c487") which returned 405.
        # This step uses the FULL UUID (e.g. "9a32c487-xxxx-xxxx-xxxx-xxxxxxxxxxxx")
        # which is the correct identifier for the API.
        run: |
          set -euo pipefail
          export CLOUDFLARE_API_TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}"
          export CLOUDFLARE_ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"

          DEPLOYMENT_SHORT_ID="${{ steps.deploy-pages.outputs.deployment_id }}"
          echo "Deployment short ID: $DEPLOYMENT_SHORT_ID"

          # Step 1: Get the full UUID for the deployment
          echo "Fetching full deployment UUID..."
          LIST_RESPONSE=$(curl -s \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/amir-btc-assistant/deployments?per_page=20&sort_by=created_on&sort_order=desc" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}")

          FULL_UUID=$(echo "$LIST_RESPONSE" | python3 -c "import sys, json; d=json.load(sys.stdin); deps=d.get('result',[]); print(next((dep.get('id') for dep in deps if dep.get('short_id')=='$DEPLOYMENT_SHORT_ID'), ''))" 2>/dev/null || echo "")

          if [ -z "$FULL_UUID" ]; then
            echo "⚠️ Could not find full UUID for deployment $DEPLOYMENT_SHORT_ID"
            echo "Trying rollout with short_id instead..."
            FULL_UUID="$DEPLOYMENT_SHORT_ID"
          fi

          echo "Full deployment UUID: $FULL_UUID"

          # Step 2: Call the rollout endpoint to promote to production
          echo ""
          echo "Promoting deployment $FULL_UUID to production via rollout API..."
          ROLLOUT_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/amir-btc-assistant/deployments/$FULL_UUID/rollout" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json")
          ROLLOUT_HTTP_CODE=$(echo "$ROLLOUT_RESPONSE" | tail -1)
          ROLLOUT_BODY=$(echo "$ROLLOUT_RESPONSE" | head -n -1)
          echo "Rollout API HTTP Status: $ROLLOUT_HTTP_CODE"
          echo "Rollout API Response: $ROLLOUT_BODY"

          if [ "$ROLLOUT_HTTP_CODE" = "200" ]; then
            ROLLOUT_SUCCESS=$(echo "$ROLLOUT_BODY" | python3 -c "import sys,json; print(json.load(sys.stdin).get('success', False))" 2>/dev/null || echo "False")
            if [ "$ROLLOUT_SUCCESS" = "True" ]; then
              echo "✅ Deployment promoted to production via rollout API"
              # Wait for the production alias to update
              echo "Waiting 15s for production alias to update..."
              sleep 15
              exit 0
            fi
          fi

          echo "⚠️ Rollout API did not succeed (HTTP $ROLLOUT_HTTP_CODE)"
          echo "The rollout endpoint is for gradual traffic splitting, not promotion."
          echo ""

          # Step 3: Try to find and DELETE the old 9439bac production deployment
          # This forces the production alias to point to a newer deployment
          echo "=== Attempting to find old production deployment (9439bac) ==="
          # List ALL deployments (up to 100) to find the old one
          ALL_DEPLOYMENTS=$(curl -s \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/amir-btc-assistant/deployments?per_page=100&sort_by=created_on&sort_order=desc" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}")

          # Find the 9439bac deployment (the old production one)
          OLD_UUID=$(echo "$ALL_DEPLOYMENTS" | python3 -c "import sys, json; d=json.load(sys.stdin); deps=d.get('result',[]); print(next((dep.get('id') for dep in deps if dep.get('short_id')=='9439bac'), ''))" 2>/dev/null || echo "")

          if [ -n "$OLD_UUID" ]; then
            echo "Found old production deployment 9439bac (UUID: $OLD_UUID)"
            echo "Deleting it to force production alias to update..."
            DELETE_RESPONSE=$(curl -s -w "\n%{http_code}" -X DELETE \
              "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/amir-btc-assistant/deployments/$OLD_UUID" \
              -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}")
            DELETE_HTTP_CODE=$(echo "$DELETE_RESPONSE" | tail -1)
            DELETE_BODY=$(echo "$DELETE_RESPONSE" | head -n -1)
            echo "Delete API HTTP Status: $DELETE_HTTP_CODE"
            echo "Delete API Response: $DELETE_BODY"

            if [ "$DELETE_HTTP_CODE" = "200" ]; then
              echo "✅ Old production deployment deleted"
              echo "Waiting 15s for production alias to update..."
              sleep 15
            fi
          else
            echo "Old deployment 9439bac not found in recent 100 deployments"
            echo "It may be too old or already deleted"
          fi

          # Don't fail — let the Verify step determine if production is correct
          exit 0
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  verify:
    name: Verify Production Deployment
    needs: [deploy-worker, deploy-pages]
    runs-on: ubuntu-latest
    if: ${{ always() && needs.deploy-worker.result == 'success' && needs.deploy-pages.result == 'success' }}
    steps:
      - name: Wait for propagation
        run: sleep 15
      - name: Verify Worker (calendar_reminders route must exist)
        run: |
          set -e
          CODE=$(curl -s -o /dev/null -w "%{http_code}" https://amir-btc-assistant-api-production.amirkamari9939.workers.dev/api/calendar/reminders)
          echo "calendar/reminders → HTTP $CODE"
          if [ "$CODE" = "404" ]; then
            echo "❌ FAIL: calendar_reminders route still missing — production Worker NOT updated"
            exit 1
          fi
          echo "✅ Worker has calendar_reminders route"
      - name: Verify Worker (farsi-news route exists — returns 401 in production, not 404)
        run: |
          # farsi-news is intentionally auth-gated in production (requires Telegram
          # initData + channel join). The correct post-deploy state is 401 (route
          # exists, auth required) — NOT 404 (route missing = old version).
          CODE=$(curl -s -o /dev/null -w "%{http_code}" https://amir-btc-assistant-api-production.amirkamari9939.workers.dev/api/farsi-news)
          echo "farsi-news → HTTP $CODE"
          if [ "$CODE" = "404" ]; then
            echo "❌ FAIL: farsi-news route missing (404) — production Worker NOT updated"
            exit 1
          fi
          echo "✅ farsi-news route exists (401 = auth required, correct in production)"
      - name: Verify Pages (version.json buildId)
        run: |
          BUILD_ID=$(curl -s https://amir-btc-assistant.pages.dev/version.json | python3 -c "import sys,json; print(json.load(sys.stdin)['buildId'])")
          echo "Pages buildId: $BUILD_ID"
          # Build ID format: TIMESTAMP-SHORTSHA. Extract the shortsha after the dash.
          SHORTSHA=$(echo "$BUILD_ID" | sed 's/.*-//')
          echo "Short SHA: $SHORTSHA"
          COMMIT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "Expected commit short SHA: $COMMIT_SHA"
          if [ "$SHORTSHA" = "$COMMIT_SHA" ]; then
            echo "✅ Pages buildId matches deployed commit"
          else
            echo "❌ FAIL: Pages buildId ($SHORTSHA) != commit ($COMMIT_SHA)"
            echo "Production is serving an OLD deployment. The Pages deploy did not promote to production."
            echo "This indicates a deployment promotion issue, not a CDN cache issue."
            exit 1
          fi
      - name: Verify Pages (defer warm-start attrs)
        run: |
          DEFER_COUNT=$(curl -s https://amir-btc-assistant.pages.dev/ | grep -c 'defer')
          echo "defer attribute count: $DEFER_COUNT"
          if [ "$DEFER_COUNT" -lt 5 ]; then
            echo "❌ FAIL: defer attributes missing — warm-start fix NOT deployed"
            exit 1
          fi
          echo "✅ Pages has defer warm-start attributes"

