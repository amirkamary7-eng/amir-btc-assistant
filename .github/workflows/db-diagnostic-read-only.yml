name: DB Diagnostic (Read-Only)

on:
  workflow_dispatch:

jobs:
  db-diagnostic:
    name: Read-Only Production DB Inspection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client > /dev/null 2>&1
          psql --version

      - name: Run read-only diagnostic queries
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_DATABASE_URL" ]; then
            echo "SUPABASE_DATABASE_URL secret is empty or missing"
            exit 1
          fi

          # Connection test
          echo "=== CONNECTION TEST ==="
          psql "$SUPABASE_DATABASE_URL" -X -t -c "SELECT current_database() AS database_name, current_user AS database_user, version() AS postgres_version;" 2>&1 | sed 's|postgresql://[^@]*@|postgresql://<redacted>@|g'

          # 1. users schema
          echo ""
          echo "=== USERS SCHEMA ==="
          psql "$SUPABASE_DATABASE_URL" -X -c "SELECT column_name, data_type, is_nullable, column_default FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'users' ORDER BY ordinal_position;" 2>&1 | sed 's|postgresql://[^@]*@|postgresql://<redacted>@|g'

          # 2. admins schema
          echo ""
          echo "=== ADMINS SCHEMA ==="
          psql "$SUPABASE_DATABASE_URL" -X -c "SELECT column_name, data_type, is_nullable, column_default FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'admins' ORDER BY ordinal_position;" 2>&1 | sed 's|postgresql://[^@]*@|postgresql://<redacted>@|g'

          # 3. Legacy broadcasts table existence
          echo ""
          echo "=== BROADCASTS TABLE EXISTS? ==="
          psql "$SUPABASE_DATABASE_URL" -X -c "SELECT EXISTS (SELECT 1 FROM information_schema.tables WHERE table_schema = 'public' AND table_name = 'broadcasts') AS broadcasts_exists;" 2>&1 | sed 's|postgresql://[^@]*@|postgresql://<redacted>@|g'

          # 4. If broadcasts exists, get schema + row count
          echo ""
          echo "=== BROADCASTS SCHEMA (if exists) ==="
          psql "$SUPABASE_DATABASE_URL" -X -c "SELECT column_name, data_type, is_nullable, column_default FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'broadcasts' ORDER BY ordinal_position;" 2>&1 | sed 's|postgresql://[^@]*@|postgresql://<redacted>@|g'

          echo ""
          echo "=== BROADCASTS ROW COUNT (if exists) ==="
          psql "$SUPABASE_DATABASE_URL" -X -c "SELECT COUNT(*) AS total_rows FROM public.broadcasts;" 2>&1 | sed 's|postgresql://[^@]*@|postgresql://<redacted>@|g'

          # 5. notification_broadcasts schema
          echo ""
          echo "=== NOTIFICATION_BROADCASTS SCHEMA ==="
          psql "$SUPABASE_DATABASE_URL" -X -c "SELECT column_name, data_type, is_nullable, column_default FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'notification_broadcasts' ORDER BY ordinal_position;" 2>&1 | sed 's|postgresql://[^@]*@|postgresql://<redacted>@|g'

          # 6. notification_broadcasts: recent 30
          echo ""
          echo "=== RECENT BROADCASTS (latest 30) ==="
          psql "$SUPABASE_DATABASE_URL" -X -c "SELECT id, target_type, status, total_sent, total_delivered, created_at, sent_at FROM public.notification_broadcasts ORDER BY created_at DESC LIMIT 30;" 2>&1 | sed 's|postgresql://[^@]*@|postgresql://<redacted>@|g'

          # 7. target_type distribution
          echo ""
          echo "=== TARGET_TYPE DISTRIBUTION ==="
          psql "$SUPABASE_DATABASE_URL" -X -c "SELECT target_type, COUNT(*) AS count FROM public.notification_broadcasts GROUP BY target_type ORDER BY count DESC;" 2>&1 | sed 's|postgresql://[^@]*@|postgresql://<redacted>@|g'

          # 8. Active broadcasts
          echo ""
          echo "=== BROADCASTS WITH target_type=active ==="
          psql "$SUPABASE_DATABASE_URL" -X -c "SELECT id, target_type, status, total_sent, total_delivered, created_at, sent_at FROM public.notification_broadcasts WHERE target_type = 'active' ORDER BY created_at DESC LIMIT 30;" 2>&1 | sed 's|postgresql://[^@]*@|postgresql://<redacted>@|g'

          # 9. notifications schema
          echo ""
          echo "=== NOTIFICATIONS SCHEMA ==="
          psql "$SUPABASE_DATABASE_URL" -X -c "SELECT column_name, data_type FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'notifications' ORDER BY ordinal_position;" 2>&1 | sed 's|postgresql://[^@]*@|postgresql://<redacted>@|g'

          # 10. For latest 5 broadcasts, count matching notification + queue rows
          echo ""
          echo "=== BROADCAST CONSISTENCY CHECK (latest 5) ==="
          psql "$SUPABASE_DATABASE_URL" -X -c "
          SELECT
            nb.id AS broadcast_id,
            nb.target_type,
            nb.status,
            nb.total_sent,
            nb.total_delivered,
            (SELECT COUNT(*)::int FROM notifications n WHERE n.id LIKE 'bc_' || nb.id || '_%') AS actual_notif_rows,
            (SELECT COUNT(*)::int FROM notification_queue nq WHERE nq.notification_id LIKE 'bc_' || nb.id || '_%') AS actual_queue_rows
          FROM notification_broadcasts nb
          ORDER BY nb.created_at DESC
          LIMIT 5;
          " 2>&1 | sed 's|postgresql://[^@]*@|postgresql://<redacted>@|g'

          # 11. notifications table column check
          echo ""
          echo "=== NOTIFICATIONS TABLE EXISTS? ==="
          psql "$SUPABASE_DATABASE_URL" -X -c "SELECT EXISTS (SELECT 1 FROM information_schema.tables WHERE table_schema = 'public' AND table_name = 'notifications') AS notifications_exists;" 2>&1 | sed 's|postgresql://[^@]*@|postgresql://<redacted>@|g'

          # 12. notification_queue table column check
          echo ""
          echo "=== NOTIFICATION_QUEUE TABLE EXISTS? ==="
          psql "$SUPABASE_DATABASE_URL" -X -c "SELECT EXISTS (SELECT 1 FROM information_schema.tables WHERE table_schema = 'public' AND table_name = 'notification_queue') AS queue_exists;" 2>&1 | sed 's|postgresql://[^@]*@|postgresql://<redacted>@|g'

          # 13. user stats for active semantics investigation
          echo ""
          echo "=== USER STATS ==="
          psql "$SUPABASE_DATABASE_URL" -X -c "
          SELECT
            COUNT(*) AS total_users,
            COUNT(*) FILTER (WHERE channel_joined = TRUE) AS joined_channel,
            COUNT(*) FILTER (WHERE last_active_at IS NOT NULL) AS has_last_active,
            COUNT(*) FILTER (WHERE last_active_at >= CURRENT_DATE) AS active_today,
            COUNT(*) FILTER (WHERE last_active_at >= CURRENT_DATE - INTERVAL '7 days') AS active_7d,
            COUNT(*) FILTER (WHERE last_active_at >= CURRENT_DATE - INTERVAL '30 days') AS active_30d,
            COUNT(*) FILTER (WHERE is_premium = TRUE) AS is_premium_flag
          FROM users;
          " 2>&1 | sed 's|postgresql://[^@]*@|postgresql://<redacted>@|g'

          # 14. Check if users.active column exists
          echo ""
          echo "=== USERS.ACTIVE COLUMN CHECK ==="
          psql "$SUPABASE_DATABASE_URL" -X -c "SELECT column_name FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'users' AND column_name = 'active';" 2>&1 | sed 's|postgresql://[^@]*@|postgresql://<redacted>@|g'

          # 15. All tables in public schema (for logging/audit investigation)
          echo ""
          echo "=== ALL TABLES IN public SCHEMA ==="
          psql "$SUPABASE_DATABASE_URL" -X -c "SELECT table_name FROM information_schema.tables WHERE table_schema = 'public' ORDER BY table_name;" 2>&1 | sed 's|postgresql://[^@]*@|postgresql://<redacted>@|g'

          # Cleanup
          unset SUPABASE_DATABASE_URL
          echo ""
          echo "=== DIAGNOSTIC COMPLETE ==="
